name: Ingest ticket posts

on:
  schedule:
    # 1日1回。UTC 9時 = Gemini無料枠の日次リセット(米国太平洋時間の深夜0時 ≒ UTC 7時)の直後に実行し、
    # 常にフレッシュな無料枠で回せるようにする(JST 18時)。
    - cron: '0 9 * * *'
  workflow_dispatch: {} # 手動実行も可能

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # JSレンダリング(公式サイトがSPAの場合の予定取得)用に Chromium を導入
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Restore X session cookies
        run: printf '%s' "$X_COOKIES_JSON" > cookies.json
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
      - name: Restore accounts list
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
      - name: Run worker
        run: python worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 公式サイト抽出の一次エンジン(高い無料枠)。未設定なら GEMINI にフォールバック。
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # cookies.json が無効化された場合のフォールバック(任意)
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
