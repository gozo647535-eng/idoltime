name: Ingest ticket posts

on:
  schedule:
    # 1日1回。UTC 9時 = Gemini無料枠の日次リセット(米国太平洋時間の深夜0時 ≒ UTC 7時)の直後に実行し、
    # 常にフレッシュな無料枠で回せるようにする(JST 18時)。
    - cron: '0 9 * * *'
    # チケットサイト発見のみ。実測はフル巡回が約42分、発見が約5分で、
    # スケジュールだけで約50分/日(≒1,550分/月)。無料枠2,000分に対して、
    # 動作確認の手動実行の分を残すため1日2回(12時間間隔)にしている。
    # フル巡回の 09:00 とは重ならない時刻。
    - cron: '37 1,13 * * *'
  workflow_dispatch:
    inputs:
      x_only:
        description: "Xのみ実行(twikit動作確認用・サイト巡回とTimeTreeをスキップ)"
        type: boolean
        default: false
      discovery_only:
        description: "チケットサイト発見のみ実行(数分・サイト巡回とTimeTreeをスキップ)"
        type: boolean
        default: false
      site_only:
        description: "公式サイト巡回のみ実行(TimeTree・e+・発見をスキップ)"
        type: boolean
        default: false
      site_slugs:
        description: "巡回するグループのslugをカンマ区切りで指定(順番待ちとsite_skipを無視。取れないサイトの切り分け用)"
        type: string
        default: ""
      gcal_only:
        description: "Googleカレンダーの取り込みのみ実行(1分ほど。カレンダーを登録した直後の確認用)"
        type: boolean
        default: false
      livepocket_only:
        description: "LivePocketの新着一覧のみ巡回(数分。先着の取り込み確認用)"
        type: boolean
        default: false
      yrt_force:
        description: "当日取得済みのチケットページも読み直す(発売日時や会場の入り直しの確認用)"
        type: boolean
        default: false
      tiget_only:
        description: "TiGETの新着一覧のみ巡回(数分。先着の取り込み確認用)"
        type: boolean
        default: false
      release_only:
        description: "店舗のリリースイベントのみ巡回(タワレコ/HMV/ヴィレヴァン。数分)"
        type: boolean
        default: false
      sale_only:
        description: "集めてあるリンクから発売日時・先着・券種を入れ直すだけ(先着一覧の穴埋め)"
        type: boolean
        default: false
      sale_urls:
        description: "読み直す販売ページをカンマ区切りで指定(省略時は自動で選ぶ)"
        type: string
        default: ""
      sale_force:
        description: "当日すでに読んだ販売ページも読み直す"
        type: boolean
        default: false
      sale_refresh_limit:
        description: "そのとき読む販売ページの上限(既定40)"
        type: string
        default: ""
      listing_check:
        description: "チケットサイトの一覧ページに到達できるかだけ確認(数秒)"
        type: boolean
        default: false
      listing_check_urls:
        description: "確認するURLをカンマ区切りで指定(省略時は既定の一覧ページ)"
        type: string
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Groqのレート(TPM)順守で1件ごとに間隔を空けるため、全サイト巡回に余裕を持たせる
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # X取り込み(twikit)は不安定な外部forkのため、Xを使う時だけ隔離インストールする。
      # 失敗してもサイト取り込みは止めない(continue-on-error)。
      - name: Install X ingest deps (twikit)
        if: ${{ github.event.inputs.x_only == 'true' || vars.ENABLE_X_INGEST == '1' }}
        continue-on-error: true
        run: pip install aiohttp "git+https://codeberg.org/phin/twikit.git"
      # JSレンダリング(公式サイトがSPAの場合の予定取得)用に Chromium を導入
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Restore X session cookies
        run: printf '%s' "$X_COOKIES_JSON" > cookies.json
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
      - name: Restore accounts list
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
      - name: Run worker
        run: python worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 公式サイト抽出の一次エンジン(高い無料枠)。未設定なら GEMINI にフォールバック。
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # X取り込み: リポジトリ変数 ENABLE_X_INGEST=1 で日次有効化。x_only=true は動作確認用。
          ENABLE_X_INGEST: ${{ vars.ENABLE_X_INGEST }}
          X_ONLY: ${{ github.event.inputs.x_only }}
          # ログを行ごとに流す。既定のブロックバッファだと出力が数分遅れて届き、
          # どこで時間を使ったのかログから読めない(run #141 の切り分けで困った)。
          PYTHONUNBUFFERED: "1"
          # 発見のみモード: 高頻度側の cron、または手動実行のチェックで有効になる
          DISCOVERY_ONLY: ${{ github.event.schedule == '37 1,13 * * *' || github.event.inputs.discovery_only == 'true' }}
          # 公式サイト巡回のみ / 対象グループの限定(どちらも手動実行の切り分け用)
          SITE_ONLY: ${{ github.event.inputs.site_only }}
          SITE_SLUGS: ${{ github.event.inputs.site_slugs }}
          GCAL_ONLY: ${{ github.event.inputs.gcal_only }}
          LIVEPOCKET_ONLY: ${{ github.event.inputs.livepocket_only }}
          TIGET_ONLY: ${{ github.event.inputs.tiget_only }}
          RELEASE_ONLY: ${{ github.event.inputs.release_only }}
          SALE_ONLY: ${{ github.event.inputs.sale_only }}
          SALE_REFRESH_LIMIT: ${{ github.event.inputs.sale_refresh_limit }}
          SALE_FORCE: ${{ github.event.inputs.sale_force }}
          SALE_URLS: ${{ github.event.inputs.sale_urls }}
          YRT_FORCE: ${{ github.event.inputs.yrt_force }}
          LISTING_CHECK: ${{ github.event.inputs.listing_check }}
          LISTING_CHECK_URLS: ${{ github.event.inputs.listing_check_urls }}
          # cookies.json が無効化された場合のフォールバック(任意)
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
